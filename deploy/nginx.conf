# nginx site config for the Torix Lead Engine.
#
# The two settings that actually matter here: proxy_read_timeout and
# proxy_buffering off. Steps 1–4 stream NDJSON progress over one long HTTP
# request (a national NPPES scan alone runs ~13 minutes) — nginx's default
# 60s read timeout would cut that off mid-run, and buffering would hold back
# every progress line until the whole response finished, defeating the point
# of streaming it at all.
#
# Installed by setup.sh to /etc/nginx/sites-available/torix-tool with
# DOMAIN_OR_IP already substituted — edit the copy on the server, not this
# file, if you need to change something after the fact.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_OR_IP;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running streaming pipeline steps — see the file comment above.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
